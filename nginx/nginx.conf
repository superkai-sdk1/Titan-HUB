user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  # HTTP → HTTPS redirect
  server {
    listen 80;
    server_name titanpos.ru www.titanpos.ru;
    return 301 https://$host$request_uri;
  }

  # Main HTTPS server
  server {
    listen 443 ssl http2;
    server_name titanpos.ru www.titanpos.ru;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 10m;

    # API
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://api:3001;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 300s;
    }

    # Auth rate limiting
    location /api/auth/login {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE (system update streaming)
    location /api/system/update {
      proxy_pass http://api:3001;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
    }

    # MinIO media
    location /media/ {
      proxy_pass http://minio:9000/titan-hub/;
      proxy_set_header Host $host;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    # Wallet (Telegram Mini App). Приложение собрано с basePath/assetPrefix
    # '/wallet', поэтому его статика приходит как /wallet/_next/static/*.js.
    #
    # ВАЖНО про приоритет location в nginx: regex-локейшены (~*) побеждают
    # обычные префиксные. Без модификатора "location /wallet" проигрывал бы
    # общему "location ~* \.(js|css|...)$" ниже, и чанки кошелька уходили бы на
    # web:3000 (чужая сборка) → пустая PWA. Модификатор "^~" делает префикс
    # /wallet/ приоритетнее любого regex, поэтому вся статика кошелька (в т.ч.
    # /wallet/_next/...) гарантированно идёт на upstream wallet:3002.
    #
    # URI проксируется БЕЗ изменения (нет слеша в proxy_pass), так что префикс
    # /wallet сохраняется — именно его ждёт приложение из-за basePath.
    location ^~ /wallet/ {
      proxy_pass http://wallet:3002;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
      # Хэшированные чанки кошелька (/wallet/_next/static/*) кэшируем вечно.
      location ^~ /wallet/_next/static/ {
        proxy_pass http://wallet:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
      }
    }

    # Голый /wallet (без слеша) — точкой входа отдаём то же приложение кошелька.
    location = /wallet {
      proxy_pass http://wallet:3002;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    # Next.js static assets основного веб-приложения — кэшируем вечно
    # (имена файлов содержат хэш). Статика кошелька сюда НЕ попадает: её
    # перехватывает приоритетный "^~ /wallet/" выше.
    location /_next/static/ {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js chunks и прочие ресурсы основного веб-приложения.
    # (Чанки кошелька перехвачены "^~ /wallet/" выше и сюда не доходят.)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=86400";
    }

    # Main web app — HTML никогда не кэшируем в браузере
    location / {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      # Убираем Cache-Control от Next.js и задаём свой — no-cache для HTML
      proxy_hide_header Cache-Control;
      proxy_hide_header Pragma;
      proxy_hide_header Expires;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Expires "0" always;
    }
  }
}
