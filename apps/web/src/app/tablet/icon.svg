<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Titan Menu">
  <defs>
    <linearGradient id="menuBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c1726"/>
      <stop offset="1" stop-color="#120f18"/>
    </linearGradient>
    <linearGradient id="menuAccent" x1="120" y1="140" x2="392" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="menuGlow" cx="256" cy="256" r="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#menuBg)"/>
  <rect x="1" y="1" width="510" height="510" rx="115" stroke="#a78bfa" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="256" cy="256" r="180" fill="url(#menuGlow)"/>

  <!-- cloche dome -->
  <path d="M124 322 a132 132 0 0 1 264 0" fill="#120f18" stroke="url(#menuAccent)" stroke-width="16" stroke-linecap="round"/>
  <!-- inner highlight arc -->
  <path d="M178 314 a78 78 0 0 1 156 0" fill="none" stroke="url(#menuAccent)" stroke-width="10" stroke-linecap="round" opacity="0.5"/>

  <!-- knob -->
  <line x1="256" y1="190" x2="256" y2="160" stroke="url(#menuAccent)" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="150" r="22" fill="url(#menuAccent)"/>

  <!-- base tray -->
  <rect x="104" y="318" width="304" height="26" rx="13" fill="url(#menuAccent)"/>
</svg>
