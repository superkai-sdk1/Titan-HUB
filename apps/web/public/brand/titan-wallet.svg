<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Titan Wallet">
  <defs>
    <linearGradient id="walBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c1726"/>
      <stop offset="1" stop-color="#120f18"/>
    </linearGradient>
    <linearGradient id="walAccent" x1="128" y1="150" x2="384" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="walGlow" cx="256" cy="256" r="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#walBg)"/>
  <rect x="1" y="1" width="510" height="510" rx="115" stroke="#a78bfa" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="256" cy="256" r="180" fill="url(#walGlow)"/>

  <!-- wallet body -->
  <rect x="120" y="158" width="272" height="196" rx="36" fill="#120f18" stroke="url(#walAccent)" stroke-width="16"/>

  <!-- card peeking out at top -->
  <rect x="168" y="124" width="176" height="64" rx="18" fill="url(#walAccent)" opacity="0.9"/>

  <!-- snap button / coin slot -->
  <rect x="300" y="236" width="92" height="64" rx="20" fill="#120f18" stroke="url(#walAccent)" stroke-width="16"/>
  <circle cx="338" cy="268" r="15" fill="url(#walAccent)"/>
</svg>
