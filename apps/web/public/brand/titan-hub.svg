<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Titan HUB">
  <defs>
    <linearGradient id="hubBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c1726"/>
      <stop offset="1" stop-color="#120f18"/>
    </linearGradient>
    <linearGradient id="hubAccent" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="256" cy="256" r="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#hubBg)"/>
  <rect x="1" y="1" width="510" height="510" rx="115" stroke="#a78bfa" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="256" cy="256" r="170" fill="url(#hubGlow)"/>

  <!-- spokes -->
  <g stroke="url(#hubAccent)" stroke-width="14" stroke-linecap="round" opacity="0.55">
    <line x1="256" y1="256" x2="256" y2="138"/>
    <line x1="256" y1="256" x2="358" y2="315"/>
    <line x1="256" y1="256" x2="154" y2="315"/>
  </g>

  <!-- outer nodes -->
  <g>
    <circle cx="256" cy="138" r="34" fill="#120f18" stroke="url(#hubAccent)" stroke-width="14"/>
    <circle cx="358" cy="315" r="34" fill="#120f18" stroke="url(#hubAccent)" stroke-width="14"/>
    <circle cx="154" cy="315" r="34" fill="#120f18" stroke="url(#hubAccent)" stroke-width="14"/>
  </g>

  <!-- central hub -->
  <circle cx="256" cy="256" r="50" fill="url(#hubAccent)"/>
  <circle cx="256" cy="256" r="20" fill="#120f18"/>
</svg>
