<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Titan Menu</title>
<!--
  Меню для экрана ТВ (AbleSign) — отдаётся по /menu (rewrite в next.config.ts).

  Намеренно БЕЗ React/Next и без оболочки приложения: плееры вывесок открывают
  ссылку во встроенном WebView, часто устаревшем или с отключённым хранилищем, и
  оболочка PWA там падала с ошибкой приложения. Поэтому здесь — самодостаточная
  страница на консервативном JS (ES5: var/function, XHR, без flex-gap и CSS-переменных),
  каждое обращение к localStorage — в try/catch, никакого Service Worker.

  Правила экрана (владелец): вертикальный HD-ТВ 32″; без прокрутки; каждая позиция в
  одну строку; занят весь экран — кегль максимально крупный, остаток высоты уходит
  в воздух между строками; тарифы и кабинки — лентой внизу. Если позиций слишком
  много для читаемого кегля — страницы сами сменяют друг друга.
  Данные — GET /api/menu/public раз в 20 с; экран перерисовывается ТОЛЬКО если меню
  изменилось (цена, видимость, состав). Сама страница перезагружается раз в 12 часов.
  Перезагрузки самим плеером (чаще 30 мин) проходят без вступительной анимации.
  /menu?debug=1 — показать браузер плеера, размер экрана и ошибки.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap">
<script>
  // Шрифты темы (?theme=…) — подключаем при разборе <head>, чтобы основной скрипт
  // стартовал уже с ними (иначе первый показ шёл бы на запасном шрифте).
  (function () {
    var fam = {
      neon: 'Comfortaa:wght@700', deco: 'Forum', synth: 'Russo+One', avant: 'Dela+Gothic+One',
      dossier: 'PT+Mono', halloween: 'Rubik+Wet+Paint&family=Rubik:wght@500;700;800'
    };
    // Тема: из ссылки (предпросмотр) или из последнего ответа сервера (выбор в «Настройках»).
    var m = /[?&]theme=([a-z]+)(&|$)/.exec(location.search), t = m && m[1];
    if (!t) { try { var c = JSON.parse(localStorage.getItem('titan_menu_screen') || 'null'); t = c && c.theme; } catch (e) { /* хранилище недоступно */ } }
    if (t && fam[t]) document.write('<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=' + fam[t] + '&display=swap">');
  })();
</script>
<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0f0b17; }

.blob-b { right: -45vmax; bottom: -55vmax; background: radial-gradient(circle, rgba(94,23,235,.5) 0%, rgba(94,23,235,0) 64%); -webkit-animation: drift-b 58s ease-in-out infinite alternate; animation: drift-b 58s ease-in-out infinite alternate; }
.blob-c { left: 20vw; top: 25vh; width: 60vmax; height: 60vmax; background: radial-gradient(circle, rgba(76,215,246,.07) 0%, rgba(76,215,246,0) 60%); -webkit-animation: drift-c 70s ease-in-out infinite alternate; animation: drift-c 70s ease-in-out infinite alternate; }
.vignette { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 50% 40%, rgba(15,11,23,0) 50%, rgba(8,6,13,.7) 100%); }

.club { margin-left: .7em; font-size: 2.3em; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: #a78bfa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-animation: rise .8s .1s cubic-bezier(.16,1,.3,1) both; animation: rise .8s .1s cubic-bezier(.16,1,.3,1) both; }

.body { position: absolute; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-justify-content: space-between; justify-content: space-between; }

.head { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; font-size: 1.06em; line-height: 1.2; font-weight: 700; letter-spacing: -.005em; color: #c4b5fd; white-space: nowrap; }

.pr { -webkit-flex: none; flex: none; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }

/* Лента внизу: две фиолетовые половины из шаблона владельца. */
.band { position: relative; display: -webkit-flex; display: flex; overflow: hidden; border-radius: .8em; -webkit-flex: none; flex: none; box-shadow: 0 .6em 2em rgba(40,10,110,.45); -webkit-animation: band-in .9s .3s cubic-bezier(.16,1,.3,1) both; animation: band-in .9s .3s cubic-bezier(.16,1,.3,1) both; }

.ruler .rs > div { display: block; }

@-webkit-keyframes rise { from { opacity: 0; -webkit-transform: translate3d(0,.3em,0); } to { opacity: 1; -webkit-transform: none; } }
@keyframes rise { from { opacity: 0; transform: translate3d(0,.3em,0); } to { opacity: 1; transform: none; } }

/* ════ Темы оформления (/menu?theme=…). Раскладка общая: темы меняют шрифты, цвета
   и декор, но НЕ вертикальные метрики (строка 1.2, заголовок 1.06em, поля) — на них
   построен расчёт. Ширины текста меряются той же вёрсткой, так что шрифт, регистр
   и межбуквенный интервал темы учитываются автоматически. Декор — слой #deco за
   контентом; анимации — только transform/opacity. ════ */

#deco { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; }
#deco > * { position: absolute; }
.t-neon .blob, .t-neon .vignette, .t-deco .blob, .t-synth .blob, .t-synth .vignette,
.t-avant .blob, .t-avant .vignette, .t-dossier .blob, .t-halloween .blob-a, .t-halloween .blob-c { display: none; }
@-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 1. «Неон»: ночной бар, кирпичная стена, вывеска-трубка ─────────────────── */

  background-color: #0b0810;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='60'><g fill='none' stroke='%23ffffff' stroke-opacity='.06' stroke-width='2'><path d='M0 1h120M0 31h120M60 1v30M0 31v29M120 31v29'/></g></svg>");
  background-size: 16em 8em;
}
.t-neon .nglow { left: -20em; top: -30em; width: 80em; height: 60em; border-radius: 50%; background: radial-gradient(ellipse, rgba(168,85,247,.28) 0%, rgba(168,85,247,0) 65%); }
.t-neon .nglow2 { right: -30em; bottom: -20em; width: 80em; height: 60em; border-radius: 50%; background: radial-gradient(ellipse, rgba(236,72,153,.18) 0%, rgba(236,72,153,0) 65%); }

  -webkit-animation: rise .8s cubic-bezier(.16,1,.3,1) both, flicker 11s 2s infinite; animation: rise .8s cubic-bezier(.16,1,.3,1) both, flicker 11s 2s infinite; }

.t-neon .cell .dt { border-bottom-color: rgba(165,243,252,.35); }

@-webkit-keyframes flicker { 0%, 90%, 92%, 95%, 100% { opacity: 1; } 91% { opacity: .45; } 93.5% { opacity: .75; } }

html.t-deco, .t-deco body { background: #0b0a0d; }

/* ── 3. «Синтвейв»: 1986 — закат, солнце в полоску, бегущая сетка-пол ───────── */
html.t-synth, .t-synth body { background: #10031d; }
.t-synth .sky { top: 0; left: 0; right: 0; height: 100%; background: linear-gradient(180deg, #2a0846 0%, #1b0533 26%, #12031f 55%, #0c0216 100%); }

    var w = function (el) { return el ? el.getBoundingClientRect().width / 100 : 0; };
    var out = [];
    var blocks = ruler.children;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      var rows = [];
      var its = b.querySelectorAll('.it');
      for (var j = 0; j < its.length; j++) {
        rows.push({ name: Math.max(0.01, w(its[j].querySelector('.nm'))), price: w(its[j].querySelector('.pr')) });
      }
      out.push({ title: Math.max(0.01, w(b.querySelector('.head-t'))), note: w(b.querySelector('.note')), rows: rows });
    }
    return out;
  }

  function splitSections() {
    var all = (state.data && state.data.sections) || [];
    var band = [], reg = [];
    all.forEach(function (s) { (s.featured ? band : reg).push(s); });
    return { band: band, reg: reg };
  }

  // why: 'data' — меню изменилось (перерисовка с появлением); 'resize' / 'fonts' —
  // тихая перестройка без анимации, если раскладка вообще поменялась.
  function relayout(why) {
    try {
      var geo = geometry();
      var root = $('root');
      root.style.fontSize = geo.u + 'px';
      var header = $('header');
      header.style.left = geo.padX + 'px';
      header.style.right = geo.padX + 'px';
      header.style.top = (3 * geo.u) + 'px';
      $('club').textContent = (state.data && state.data.clubName) || '';
      var body = $('body');
      body.style.top = geo.top + 'px';
      body.style.left = geo.padX + 'px';
      body.style.right = geo.padX + 'px';
      body.style.height = geo.availRaw + 'px';
      if (!state.data || !state.ready || geo.u <= 0) return;
      var sp = splitSections();
      if (!sp.reg.length && !sp.band.length) {
        state.plan = null;
        body.innerHTML = '<div class="empty">Меню скоро появится</div>';
        return;
      }
      var regW = measure(sp.reg, false);
      var bandW = measure(sp.band, true);
      $('ruler').innerHTML = '';
      var next = plan(regW, bandW, sp.band, geo);
      // Та же раскладка (дозагрузка шрифта, повторный опрос) — не перерисовываем,
      // чтобы не проигрывать появление заново.
      var sig = JSON.stringify([next, sp, geo.w, geo.h, THEME]);
      if (sig === state.sig) return;
      state.sig = sig;
      state.plan = next;
      state.sp = sp;
      state.geo = geo;
      if (state.page >= next.pages.length) state.page = 0;
      var first = !state.rendered;
      state.renders++;
      state.lastWhy = first ? 'первый показ' : why === 'data' ? 'меню изменилось' : why === 'theme' ? 'тема' : why === 'resize' ? 'размер экрана' : 'шрифт';
      renderPage(first ? (state.quiet ? 'silent' : 'enter') : why === 'data' || why === 'theme' ? 'enter' : 'silent');
    } catch (e) {
      report('Раскладка: ' + (e && e.message ? e.message : e));
    }
  }

  function clearTimers() { state.timers.forEach(function (t) { clearTimeout(t); }); state.timers = []; }

  // ── Декор тем (слой #deco за контентом) ─────────────────────────────────

  function n1(x) { return x.toFixed(1); }
  // Веер лучей ар-деко: n лучей вокруг центра.
  function sunburstSvg(n) {
    var out = '<svg viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg"><g fill="#d9b56d">';
    for (var i = 0; i < n; i++) {
      var a1 = 2 * i * Math.PI / n, a2 = a1 + 0.55 * Math.PI / n;
      out += '<polygon points="0,0 ' + n1(100 * Math.cos(a1)) + ',' + n1(100 * Math.sin(a1)) + ' ' + n1(100 * Math.cos(a2)) + ',' + n1(100 * Math.sin(a2)) + '"/>';
    }
    return out + '</g></svg>';
  }
  // Паутина в углу: лучи из угла и провисающие нити между ними.
  function webSvg() {
    var rays = 7, rings = 6, pts = [], i, j;
    var out = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#d8ccff" stroke-width=".5" stroke-opacity=".7">';
    for (i = 0; i < rays; i++) {
      var a = i / (rays - 1) * Math.PI / 2;
      pts.push([Math.cos(a), Math.sin(a)]);
      out += '<line x1="0" y1="0" x2="' + n1(100 * pts[i][0]) + '" y2="' + n1(100 * pts[i][1]) + '"/>';
    }
    for (j = 1; j <= rings; j++) {
      var r = 100 * j / (rings + 0.5);
      var d = 'M' + n1(r * pts[0][0]) + ' ' + n1(r * pts[0][1]);
      for (i = 1; i < rays; i++) {
        d += ' Q' + n1(r * 0.86 * (pts[i - 1][0] + pts[i][0]) / 2) + ' ' + n1(r * 0.86 * (pts[i - 1][1] + pts[i][1]) / 2) +
          ' ' + n1(r * pts[i][0]) + ' ' + n1(r * pts[i][1]);
      }
      out += '<path d="' + d + '"/>';
    }
    return out + '</g></svg>';
  }
  var BAT = '<svg viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg"><path fill="#2a1640" d="M50 18c3-6 6-8 8-7-1 3 1 5 3 5 7-1 13-6 17-14 2 8 9 15 22 17-9 2-14 7-15 15-5-5-11-6-17-4-6 2-11 7-15 15-4-8-9-13-15-15-6-2-12-1-17 4-1-8-6-13-15-15 13-2 20-9 22-17 4 8 10 13 17 14 2 0 4-2 3-5 2-1 5 1 8 7z"/></svg>';
  var PUMPKIN = '<svg viewBox="0 0 70 62" xmlns="http://www.w3.org/2000/svg"><path d="M33 12c0-5 2-9 7-11l3 4c-4 1-5 4-5 7z" fill="#4d7c2a"/>' +
    '<ellipse cx="22" cy="37" rx="15" ry="22" fill="#d9590f"/><ellipse cx="48" cy="37" rx="15" ry="22" fill="#d9590f"/><ellipse cx="35" cy="37" rx="15" ry="24" fill="#ff7a1a"/>' +
    '<g class="pk-glow" fill="#ffd23f"><path d="M21 30l7 8H16z"/><path d="M49 30l5 8H42z"/><path d="M19 45q16 12 32 0l-4 5-4-4-4 5-4-5-4 5-4-4z"/></g></svg>';
  var DECO = {
    neon: function () { return '<div class="nglow"></div><div class="nglow2"></div>'; },
    deco: function () { return '<div class="burst">' + sunburstSvg(36) + '</div><div class="frame"></div>'; },
    synth: function () {
      return '<div class="sky"></div><div class="stars"></div><div class="sun"></div><div class="horizon"></div>' +
        '<div class="floor"><div class="plane"></div></div><div class="floorfade"></div>';
    },
    avant: function () { return '<div class="paper"></div><div class="av-ring"></div><div class="av-circle"></div><div class="av-bar"></div><div class="av-sq"></div>'; },
    dossier: function () { return '<div class="paper"></div><div class="lines"></div><div class="margin-line"></div><div class="coffee"></div><div class="stamp">Совершенно<br>секретно</div>'; },
    halloween: function () {
      return '<div class="fog"></div><div class="moon"></div><div class="web">' + webSvg() + '</div>' +
        '<div class="bat bat1">' + BAT + '</div><div class="bat bat2">' + BAT + '</div><div class="bat bat3">' + BAT + '</div>' +
        '<div class="pk" id="pk1">' + PUMPKIN + '</div><div class="pk" id="pk2">' + PUMPKIN + '</div>';
    }
  };

  // Смена темы на лету (владелец выбрал другую в «Настройках»): класс, декор, шрифты
  // темы (ждём, не дольше 3,5 с) — и перерисовка с появлением.
  function switchTheme(t) {
    var html = document.documentElement;
    html.className = (html.className.replace(/(^|\s)t-[a-z]+/g, '') + ' t-' + t).replace(/^\s+/, '');
    THEME = t;
    $('deco').innerHTML = DECO[t] ? DECO[t]() : '';
    var done = false;
    function go() { if (done) return; done = true; relayout('theme'); }
    if (!FONT_CSS[t]) { go(); return; }
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=' + FONT_CSS[t] + '&display=swap';
    link.onload = function () {
      try {
        if (document.fonts && document.fonts.load) {
          Promise.all(THEMES[t].map(function (f) { return document.fonts.load(f, 'Меню Капучино 0123456789'); })).then(go, go);
          return;
        }
      } catch (e) { /* старый движок */ }
      go();
    };
    link.onerror = go;
    document.getElementsByTagName('head')[0].appendChild(link);
    setTimeout(go, 3500);
  }

  // После отрисовки: тыквы «выглядывают» из-за верхнего края ленты (хеллоуин).
  // Координаты — по раскладке (offset*), а не getBoundingClientRect: лента ещё въезжает.
  function afterRender() {
    if (THEME !== 'halloween') return;
    var band = $('body').querySelector('.band'), p1 = $('pk1'), p2 = $('pk2');
    if (!p1 || !p2) return;
    if (!band) { p1.style.visibility = p2.style.visibility = 'hidden'; return; }
    var body = $('body');
    var top = body.offsetTop + band.offsetTop, left = body.offsetLeft + band.offsetLeft;
    var h = p1.offsetHeight, w = p1.offsetWidth;
    p1.style.left = (left + band.offsetWidth * 0.05) + 'px';
    p2.style.left = (left + band.offsetWidth * 0.95 - w) + 'px';
    p1.style.top = p2.style.top = (top - h * 0.62) + 'px';
    p1.style.visibility = p2.style.visibility = 'visible';
  }

  // mode: 'enter' — появление с каскадом и лентой; 'rotate' — смена страницы (лента
  // на месте); 'silent' — без анимаций (перестройка, тихая перезагрузка).
  function renderPage(mode) {
    var p = state.plan, sp = state.sp, geo = state.geo;
    if (!p) return;
    clearTimers();
    var pg = p.pages[state.page] || { cols: [], widths: [] };
    var k = p.k, html = '';
    // Колонки разделов.
    html += '<div class="row" style="font-size:' + p.font + 'px">';
    var order = 0;
    pg.cols.forEach(function (col, ci) {
      var w = pg.widths[ci] || 0;
      var wEm = w / p.font;
      html += '<div class="col" style="width:' + w + 'px' + (ci ? ';margin-left:' + geo.gap + 'px' : '') + '">';
      col.forEach(function (ch, ki) {
        var s = sp.reg[ch.sec], sw = p.reg[ch.sec];
        if (!s || !sw) return;
        // Каскад: слева направо, сверху вниз (≤0,6 с суммарно).
        var delay = Math.min(0.6, 0.15 + ci * 0.12 + ki * 0.07 + (order++) * 0.01);
        var anim = mode === 'silent' ? '' : '-webkit-animation-delay:' + delay.toFixed(2) + 's;animation-delay:' + delay.toFixed(2) + 's;';
        html += '<section class="sec' + (mode === 'silent' ? '' : ' in') + '" style="' + anim +
          (ki ? 'margin-top:' + (SEC_GAP * k).toFixed(3) + 'em' : '') + '">';
        html += headHtml(s, fitHead(sw, wEm), k);
        for (var i = ch.from; i < ch.to; i++) html += itemHtml(s.items[i], sw.rows[i] ? fitRow(sw.rows[i], wEm) : 1, k);
        html += '</section>';
      });
      html += '</div>';
    });
    html += '</div>';
    // Лента внизу — на каждой странице, без повторной анимации при смене страниц.
    if (sp.band.length) {
      html += '<div class="band" style="font-size:' + p.bandFont + 'px' + (mode !== 'enter' ? ';-webkit-animation:none;animation:none' : '') + '">';
      sp.band.forEach(function (s, i) {
        var bw = p.band[i], w = p.bandWidths[i] || 0;
        var wEm = w / p.bandFont - BAND_PAD_X;
        html += '<div class="cell' + (i === 0 ? ' first' : '') + '" style="width:' + w + 'px">';
        html += headHtml(s, bw ? fitHead(bw, wEm) : 1, k);
        s.items.forEach(function (it, j) { html += itemHtml(it, bw && bw.rows[j] ? fitRow(bw.rows[j], wEm) : 1, k); });
        html += '</div>';
      });
      html += '<span class="sheen"></span></div>';
    }
    $('body').innerHTML = html;
    afterRender();
    state.rendered = true;
    renderPagesIndicator();
    showMsg();
    scheduleRotation();
  }

  function itemsOnPage() {
    var pg = state.plan.pages[state.page], n = 0;
    if (pg) pg.cols.forEach(function (col) { col.forEach(function (ch) { n += ch.to - ch.from; }); });
    return n;
  }
  // На страницу — 8 с + 0,35 с на позицию (успеть найти своё), в пределах 10–22 с.
  function pageMs() { return Math.min(22000, Math.max(10000, 8000 + itemsOnPage() * 350)); }

  function renderPagesIndicator() {
    var el = $('pages');
    var n = state.plan ? state.plan.pages.length : 0;
    if (n < 2) { el.innerHTML = ''; return; }
    var html = '';
    for (var i = 0; i < n; i++) {
      var cls = i < state.page ? ' done' : i === state.page ? ' run' : '';
      var st = i === state.page ? ' style="-webkit-animation-duration:' + pageMs() + 'ms;animation-duration:' + pageMs() + 'ms"' : '';
      html += '<span class="seg"><span class="seg-fill' + cls + '"' + st + '></span></span>';
    }
    el.innerHTML = html;
  }

  function scheduleRotation() {
    if (!state.plan || state.plan.pages.length < 2) return;
    var ms = pageMs();
    state.timers.push(setTimeout(function () {
      var secs = $('body').querySelectorAll('.sec');
      for (var i = 0; i < secs.length; i++) secs[i].className = 'sec out';
    }, ms - 400));
    state.timers.push(setTimeout(function () {
      state.page = (state.page + 1) % state.plan.pages.length;
      renderPage('rotate');
    }, ms));
  }

  // ── Данные ────────────────────────────────────────────────────────────────

  function applyRaw(raw) {
    if (!raw || raw === state.raw) return;
    var parsed;
    try { parsed = JSON.parse(raw); } catch (e) { return; }
    if (!parsed || !parsed.sections) return;
    state.raw = raw;
    state.data = parsed;
    var want = URL_THEME || (isTheme(parsed.theme) ? parsed.theme : 'night');
    if (want !== THEME) { switchTheme(want); return; }
    relayout('data');
  }

  function load() {
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', API + '?t=' + Date.now(), true);
      xhr.timeout = 20000;
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status === 200) {
          storageSet(CACHE_KEY, xhr.responseText);
          applyRaw(xhr.responseText);
        } else if (!state.data) {
          report('Меню не загрузилось (HTTP ' + xhr.status + ')');
          if (!state.rendered) $('body').innerHTML = '<div class="empty">Меню обновляется…</div>';
        }
      };
      xhr.send();
    } catch (e) {
      report('Загрузка: ' + (e && e.message ? e.message : e));
    }
  }

  function tickClock() {
    var d = new Date();
    var hh = d.getHours(), mm = d.getMinutes();
    $('clock').textContent = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
  }

  // ── Старт ─────────────────────────────────────────────────────────────────

  // Перезагрузка плеером вскоре после прошлой — без вступительной анимации.
  try {
    var prev = JSON.parse(storageGet('titan_menu_load') || 'null');
    var nowTs = Date.now();
    state.quiet = !!(prev && nowTs - prev.t < QUIET_MS);
    state.loads = (prev && prev.n ? prev.n : 0) + 1;
    storageSet('titan_menu_load', JSON.stringify({ t: nowTs, n: state.loads }));
  } catch (e) { state.loads = 1; }
  if (state.quiet) $('root').className += ' quiet';
  if (DECO[THEME]) $('deco').innerHTML = DECO[THEME]();

  tickClock();
  setInterval(tickClock, 10000);
  relayout('init');
  applyRaw(storageGet(CACHE_KEY));
  load();
  setInterval(load, POLL_MS);

  // Первый показ — когда загрузится шрифт (не дольше 2,5 с), чтобы экран не
  // перестраивался на глазах; поздняя дозагрузка шрифта — тихой перестройкой.
  function markReady() {
    if (state.ready) return;
    state.ready = true;
    relayout('init');
  }
  // Шрифт грузится лениво (когда им что-то нарисовано), поэтому запрашиваем нужные
  // начертания с кириллицей явно и ждём их, а не просто document.fonts.ready.
  try {
    if (document.fonts && document.fonts.load) {
      var sample = 'Меню Капучино 0123456789 \u20bd';
      var faces = ['500', '600', '700', '800'].map(function (wt) { return wt + ' 100px Inter'; });
      faces = faces.concat(THEMES[THEME]);
      var waits = faces.map(function (face) { return document.fonts.load(face, sample); });
      Promise.all(waits).then(function () { if (state.ready) relayout('fonts'); else markReady(); }, markReady);
    }
  } catch (e) { /* старый движок */ }
  setTimeout(markReady, 2500);
  setTimeout(function () { relayout('fonts'); }, 6000);

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { relayout('resize'); }, 300);
  });
  // Раз в 12 часов — перезагрузка страницы (свежая вёрстка после деплоев), но только
  // если сервер сейчас отдаёт страницу: при сбое сети экран показывает текущее меню.
  setInterval(function () {
    try {
      var x = new XMLHttpRequest();
      x.open('GET', location.pathname + '?ping=' + Date.now(), true);
      x.timeout = 20000;
      x.onreadystatechange = function () { if (x.readyState === 4 && x.status === 200) location.reload(); };
      x.send();
    } catch (e) { /* без перезагрузки */ }
  }, RELOAD_MS);
  showMsg();
})();
</script>
</body>
</html>
