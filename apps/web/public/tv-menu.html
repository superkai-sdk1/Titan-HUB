<title>Меню</title>
<!--
  Меню для экрана ТВ (AbleSign) — отдаётся по /menu (rewrite в next.config.ts).

  Намеренно БЕЗ React/Next и без оболочки приложения: плееры вывесок открывают
  ссылку во встроенном WebView, часто устаревшем или с отключённым хранилищем, и
  оболочка PWA там падала с ошибкой приложения. Поэтому здесь — самодостаточная
  страница на консервативном JS (ES5: var/function, XHR, без flex-gap и CSS-переменных),
  каждое обращение к localStorage — в try/catch, никакого Service Worker.

  Правила экрана (владелец): вертикальный HD-ТВ 32″; без прокрутки; каждая позиция в
  одну строку; занят весь экран — кегль максимально крупный, остаток высоты уходит
  в воздух между строками; тарифы и кабинки — лентой внизу. Если позиций слишком
  много для читаемого кегля — страницы сами сменяют друг друга.
  Данные — GET /api/menu/public раз в 20 с; экран перерисовывается ТОЛЬКО если меню
  изменилось (цена, видимость, состав). Сама страница перезагружается раз в 12 часов.
  Перезагрузки самим плеером (чаще 30 мин) проходят без вступительной анимации.
  /menu?debug=1 — показать браузер плеера, размер экрана и ошибки.
-->

<style>

.blob-c { left: 20vw; top: 25vh; width: 60vmax; height: 60vmax; background: radial-gradient(circle, rgba(76,215,246,.07) 0%, rgba(76,215,246,0) 60%); -webkit-animation: drift-c 70s ease-in-out infinite alternate; animation: drift-c 70s ease-in-out infinite alternate; }

.head { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; font-size: 1.06em; line-height: 1.2; font-weight: 700; letter-spacing: -.005em; color: #c4b5fd; white-space: nowrap; }
.ico { -webkit-flex: none; flex: none; width: 1.1em; height: 1.1em; margin-right: .45em; }

.cell { -webkit-flex: none; flex: none; box-sizing: border-box; min-width: 0; padding: .7em .8em .55em; background: #5e17eb; }

.cell .rule { background: rgba(255,255,255,.35); }
.cell .nm { color: #fff; font-weight: 600; }

      lines.push('загрузка №' + state.loads + (state.quiet ? ' (тихая)' : '') + ' · перерисовок ' + state.renders + (state.lastWhy ? ' · последняя: ' + state.lastWhy : ''));
    }
    // Ошибки показываем, только пока меню не нарисовано (или в debug), — чтобы по фото экрана было что чинить.
    if (DEBUG || !state.rendered) lines = lines.concat(errors.slice(-3));
    el.textContent = lines.join('\n');
  }
  function report(text) {
    errors.push(String(text));
    showMsg();
  }
  window.onerror = function (msg, src, line, col) {
    report('Ошибка: ' + msg + (line ? ' @' + line + ':' + (col || 0) : ''));
  };

  function storageGet(key) { try { return window.localStorage ? window.localStorage.getItem(key) : null; } catch (e) { return null; } }
  function storageSet(key, val) { try { if (window.localStorage) window.localStorage.setItem(key, val); } catch (e) { /* хранилище недоступно */ } }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function money(p) {
    var n = Math.round(Number(p) * 100) / 100;
    var parts = String(n).split('.');
    return parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + (parts[1] ? ',' + parts[1] : '') + ' ₽';
  }
  function sum(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return s; }
  function maxOf(a, d) { var m = d; for (var i = 0; i < a.length; i++) if (a[i] > m) m = a[i]; return m; }
  function isPerHour(s) {
    if (!s.items.length) return false;
    for (var i = 0; i < s.items.length; i++) if (!s.items[i].perHour) return false;
    return true;
  }
  function viewW() { return window.innerWidth || document.documentElement.clientWidth || 0; }
  function viewH() { return window.innerHeight || document.documentElement.clientHeight || 0; }

  function geometry() {
    var w = viewW(), h = viewH();
    var u = Math.min(w, h) / 100;
    // Поля ≥4% — запас на overscan телевизора (часть ТВ обрезает края картинки).
    var padX = 4 * u, top = 12.6 * u, bottom = 3.6 * u;
    return { u: u, w: w, h: h, padX: padX, gap: 3 * u, contentW: w - 2 * padX, top: top, availRaw: h - top - bottom, avail: (h - top - bottom) * SAFETY };
  }

  var rowEm = function (k) { return LINE + 2 * ROW_PAD * k; };
  var headEm = function (k) { return HEAD_LINE + HEAD_PAD * k; };

  // Раскладка разделов по колонкам высотой limit (em, при k = 1). atomic: раздел, который
  // не влезает в остаток колонки, но целиком влезает в пустую, переносится целиком.
  // Иначе режется: первый кусок — не меньше двух позиций, и без одинокой позиции в конце.
  function pack(sizes, limit, atomic) {
    var head = headEm(1), row = rowEm(1);
    var cols = [[]], used = 0;
    function cur() { return cols[cols.length - 1]; }
    function newCol() { cols.push([]); used = 0; }
    for (var si = 0; si < sizes.length; si++) {
      var n = sizes[si];
      var whole = head + n * row;
      var lead = cur().length ? SEC_GAP : 0;
      if (used + lead + whole <= limit) { used += lead + whole; cur().push({ sec: si, from: 0, to: n }); continue; }
      if (atomic && whole <= limit && cur().length) { newCol(); used = whole; cur().push({ sec: si, from: 0, to: n }); continue; }
      var j = 0, guard = 0;
      while (j < n) {
        if (++guard > 1000) return null;
        var lg = cur().length ? SEC_GAP : 0;
        var k = Math.min(n, j + Math.max(0, Math.floor((limit - used - lg - head) / row)));
        if (k < n && n - k === 1 && k - j > 2) k--;
        if (k - j < Math.min(2, n - j)) {
          if (cur().length) { newCol(); continue; }
          if (k === j) return null; // позиция выше пустой колонки
        }
        used += lg + head + (k - j) * row;
        cur().push({ sec: si, from: j, to: k });
        j = k;
        if (j < n) newCol();
      }
    }
    return cols;
  }

  // Высота ленты в em её кегля: базовая часть a и коэффициент b при k — по самой длинной ячейке.
  function bandEm(band) {
    if (!band.length) return { a: 0, b: 0 };
    var n = 0;
    for (var i = 0; i < band.length; i++) n = Math.max(n, band[i].items.length);
    return { a: BAND_PAD_Y + HEAD_LINE + n * LINE, b: HEAD_PAD + 2 * ROW_PAD * n + BAND_GAP };
  }

  // Ужатие по ширине: 1, если влезает; меньше — во сколько раз ужать текст.
  function fitRow(r, widthEm) { return Math.min(1, (widthEm - 0.04 - DOTS_MIN - r.price) / r.name); }
  function fitHead(s, widthEm) { return Math.min(1, (widthEm - 0.04 - HEAD_FIXED - (s.note ? NOTE_GAP + s.note : 0)) / s.title); }
  // Ширина раздела в em: самая длинная строка при ужатии названий до fit.
  function needOf(s, fit) {
    var n = HEAD_FIXED + (s.note ? NOTE_GAP + s.note : 0) + s.title * fit;
    for (var i = 0; i < s.rows.length; i++) n = Math.max(n, DOTS_MIN + s.rows[i].price + s.rows[i].name * fit);
    return n;
  }

  // Делит ширину room между блоками: полная ширина (без ужатия), где хватает; иначе —
  // минимум (с ужатием), а остаток закрывает сперва самые мелкие нехватки. fw — предельный
  // кегль; длинные названия ужимаются, только если это даёт заметно (>12%) крупнее кегль,
  // и блоки с мелкой нехваткой остаются во всю ширину, пока кегль теряет не больше ~7%.
  function allocate(full, min, room) {
    var sumF = sum(full), sumM = sum(min);
    var order = [];
    for (var i = 0; i < full.length; i++) order.push(i);
    order.sort(function (a, b) { return (full[a] - min[a]) - (full[b] - min[b]); });
    var fMin = room / sumM;
    var fw = room / sumF;
    if (fw < fMin * 0.88) {
      fw = fMin;
      var need = sumM;
      for (var o = 0; o < order.length; o++) {
        need += full[order[o]] - min[order[o]];
        if (room / need < fMin * 0.93) break;
        fw = room / need;
      }
    }
    function at(f) {
      var widths = [], x;
      if (sumF * f <= room) {
        for (x = 0; x < full.length; x++) widths.push(full[x] * f + (room - sumF * f) * (full[x] / sumF));
        return widths;
      }
      for (x = 0; x < min.length; x++) widths.push(min[x] * f);
      var extra = room - sumM * f;
      for (var q = 0; q < order.length; q++) {
        var idx = order[q];
        var add = Math.min(extra, (full[idx] - min[idx]) * f);
        widths[idx] += add;
        extra -= add;
      }
      return widths;
    }
    return { fw: fw, at: at };
  }

  function plan(reg, bandW, bandSecs, geo) {
    var sizes = reg.map(function (s) { return s.rows.length; });
    var needFull = reg.map(function (s) { return needOf(s, 1); });
    var needMin = reg.map(function (s) { return needOf(s, FIT_MIN); });
    var be = bandEm(bandSecs);
    var fMax = FONT_MAX_U * geo.u, fMin = FONT_MIN_U * geo.u;
    var bandAlloc = bandW.length
      ? allocate(bandW.map(function (s) { return needOf(s, 1) + BAND_PAD_X; }), bandW.map(function (s) { return needOf(s, FIT_MIN) + BAND_PAD_X; }), geo.contentW)
      : null;
    function bandFont(f) { return bandAlloc ? Math.min(f, bandAlloc.fw) : f; }
    function limitEm(f) { return (geo.avail - bandFont(f) * (be.a + be.b)) / f; }
    function colNeeds(col, needs) { return Math.max(1, maxOf(col.map(function (ch) { return needs[ch.sec]; }), 0)); }
    // Колонки страницы делят ширину по длине своих строк (напиткам шире, снекам уже).
    function layoutPage(cols) {
      return allocate(cols.map(function (c) { return colNeeds(c, needFull); }), cols.map(function (c) { return colNeeds(c, needMin); }), geo.contentW - (cols.length - 1) * geo.gap);
    }
    function split(cols, c) { var pages = []; for (var i = 0; i < cols.length; i += c) pages.push(cols.slice(i, i + c)); return pages; }
    function widthLimit(cols, c) { return Math.min.apply(null, split(cols, c).map(function (pg) { return layoutPage(pg).fw; })); }

    // Наибольший кегль для c колонок × P страниц: влезает по высоте и по ширине.
    function best(c, P, atomic) {
      function ok(f) {
        var limit = limitEm(f);
        var p = limit > 0 ? pack(sizes, limit, atomic) : null;
        return !!p && p.length <= c * P && f <= widthLimit(p, c);
      }
      if (!ok(1)) return 0;
      var lo = 1, hi = fMax;
      for (var i = 0; i < 24; i++) { var mid = (lo + hi) / 2; if (ok(mid)) lo = mid; else hi = mid; }
      return lo;
    }

    var pick = null;
    if (!sizes.length) {
      pick = { f: Math.min(fMax, be.a + be.b > 0 ? geo.avail / (be.a + be.b) : fMax), c: 1, atomic: true };
    } else {
      for (var P = 1; P <= MAX_PAGES; P++) {
        var top = null;
        for (var c = 1; c <= 4; c++) {
          for (var a = 0; a < 2; a++) {
            var atomic = a === 0;
            var f = best(c, P, atomic);
            var score = f * (atomic ? 1.03 : 1); // лёгкое предпочтение целым разделам
            if (!top || score > top.score) top = { f: f, c: c, atomic: atomic, score: score };
          }
        }
        if (!pick || top.f > pick.f * 1.01) pick = top;
        // Читаемо (с допуском 6%: лучше чуть мельче, чем листать) — хватит;
        // лишняя страница почти не прибавляет кегля — тоже.
        if (pick.f >= fMin * 0.94 || (P > 1 && pick !== top)) break;
      }
    }
    var cN = pick.c, isAtomic = pick.atomic, font = pick.f;

    // Балансировка: минимальная высота колонки при том же числе страниц; целые разделы не режем.
    var limit = limitEm(font);
    var base = sizes.length ? (pack(sizes, limit, isAtomic) || pack(sizes, limit, false) || []) : [];
    var capacity = Math.max(1, Math.ceil(base.length / cN)) * cN;
    var tallest = maxOf(sizes.map(function (n) { return headEm(1) + n * rowEm(1); }), 0);
    var lo = isAtomic ? Math.min(limit, tallest) : 0, hi = limit;
    for (var i = 0; i < 24; i++) {
      var mid = (lo + hi) / 2;
      var p = pack(sizes, mid, isAtomic);
      if (p && p.length <= capacity) hi = mid; else lo = mid;
    }
    var even = sizes.length ? pack(sizes, hi, isAtomic) : null;
    var cols = even && widthLimit(even, cN) >= font * 0.97 ? even : base;
    if (cols.length) font = Math.min(font, widthLimit(cols, cN));
    var pages = split(cols, cN).map(function (pg) { return { cols: pg, widths: layoutPage(pg).at(font) }; });
    if (!pages.length) pages.push({ cols: [], widths: [] });
    var fb = bandFont(font);

    // Воздух: самая высокая колонка (+ лента) ровно до низа экрана.
    var k = K_MAX;
    cols.forEach(function (col) {
      var A = 0, B = 0;
      col.forEach(function (ch, idx) {
        var n = ch.to - ch.from;
        A += HEAD_LINE + n * LINE;
        B += HEAD_PAD + 2 * ROW_PAD * n + (idx ? SEC_GAP : 0);
      });
      k = Math.min(k, (geo.avail - A * font - be.a * fb) / (B * font + be.b * fb));
    });
    k = Math.max(1, k);

    return { font: font, bandFont: fb, k: k, pages: pages, reg: reg, band: bandW, bandWidths: bandAlloc ? bandAlloc.at(fb) : [] };
  }

  // ── Вёрстка ───────────────────────────────────────────────────────────────

  function iconHtml(id) {
    var ic = ICONS[id];
    if (!ic) return '';
    return '<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + ic.sw + '" stroke-linecap="round" stroke-linejoin="round">' + ic.body + '</svg></span>';
  }
  function fitStyle(fit) {
    return fit < 0.999 ? ' style="font-size:' + Math.max(FIT_MIN, fit).toFixed(3) + 'em"' : '';
  }
  function headHtml(s, fit, k) {
    return '<div class="head" style="padding-bottom:' + (0.32 * k).toFixed(3) + 'em">' + iconHtml(s.icon) +
      '<span class="head-t"' + fitStyle(fit) + '>' + esc(s.title) + '</span><span class="rule"></span>' +
      (isPerHour(s) ? '<span class="note">за час</span>' : '') + '</div>';
  }
  function itemHtml(it, fit, k) {
    return '<div class="it" style="padding:' + (0.17 * k).toFixed(3) + 'em 0"><span class="nm"' + fitStyle(fit) + '>' + esc(it.name) +
      '</span><span class="dt"></span><span class="pr">' + money(it.price) + '</span></div>';
  }

  // Ширины текста — по невидимой «линейке» при 100 px той же вёрсткой (веса, кегли).
  function measure(sections, inBand) {
    var ruler = $('ruler');
    var html = '';
    sections.forEach(function (s) {
      html += '<div class="rs' + (inBand ? ' cell' : '') + '"><div class="head"><span class="head-t">' + esc(s.title) + '</span>' +
        (isPerHour(s) ? '<span class="note">за час</span>' : '') + '</div>';
      s.items.forEach(function (it) {
        html += '<div class="it"><span class="nm">' + esc(it.name) + '</span><span class="pr">' + money(it.price) + '</span></div>';
      });
      html += '</div>';
    });
    ruler.innerHTML = html;
    var w = function (el) { return el ? el.getBoundingClientRect().width / 100 : 0; };
    var out = [];
    var blocks = ruler.children;
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      var rows = [];
      var its = b.querySelectorAll('.it');
      for (var j = 0; j < its.length; j++) {
        rows.push({ name: Math.max(0.01, w(its[j].querySelector('.nm'))), price: w(its[j].querySelector('.pr')) });
      }
      out.push({ title: Math.max(0.01, w(b.querySelector('.head-t'))), note: w(b.querySelector('.note')), rows: rows });
    }
    return out;
  }

  function splitSections() {
    var all = (state.data && state.data.sections) || [];
    var band = [], reg = [];
    all.forEach(function (s) { (s.featured ? band : reg).push(s); });
    return { band: band, reg: reg };
  }

  // why: 'data' — меню изменилось (перерисовка с появлением); 'resize' / 'fonts' —
  // тихая перестройка без анимации, если раскладка вообще поменялась.
  function relayout(why) {
    try {
      var geo = geometry();
      var root = $('root');
      root.style.fontSize = geo.u + 'px';
      var header = $('header');
      header.style.left = geo.padX + 'px';
      header.style.right = geo.padX + 'px';
      header.style.top = (3 * geo.u) + 'px';
      $('club').textContent = (state.data && state.data.clubName) || '';
      var body = $('body');
      body.style.top = geo.top + 'px';
      body.style.left = geo.padX + 'px';
      body.style.right = geo.padX + 'px';
      body.style.height = geo.availRaw + 'px';
      if (!state.data || !state.ready || geo.u <= 0) return;
      var sp = splitSections();
      if (!sp.reg.length && !sp.band.length) {
        state.plan = null;
        body.innerHTML = '<div class="empty">Меню скоро появится</div>';
        return;
      }
      var regW = measure(sp.reg, false);
      var bandW = measure(sp.band, true);
      $('ruler').innerHTML = '';
      var next = plan(regW, bandW, sp.band, geo);
      // Та же раскладка (дозагрузка шрифта, повторный опрос) — не перерисовываем,
      // чтобы не проигрывать появление заново.
      var sig = JSON.stringify([next, sp, geo.w, geo.h]);
      if (sig === state.sig) return;
      state.sig = sig;
      state.plan = next;
      state.sp = sp;
      state.geo = geo;
      if (state.page >= next.pages.length) state.page = 0;
      var first = !state.rendered;
      state.renders++;
      state.lastWhy = first ? 'первый показ' : why === 'data' ? 'меню изменилось' : why === 'resize' ? 'размер экрана' : 'шрифт';
      renderPage(first ? (state.quiet ? 'silent' : 'enter') : why === 'data' ? 'enter' : 'silent');
    } catch (e) {
      report('Раскладка: ' + (e && e.message ? e.message : e));
    }
  }

  function clearTimers() { state.timers.forEach(function (t) { clearTimeout(t); }); state.timers = []; }

  // mode: 'enter' — появление с каскадом и лентой; 'rotate' — смена страницы (лента
  // на месте); 'silent' — без анимаций (перестройка, тихая перезагрузка).
  function renderPage(mode) {
    var p = state.plan, sp = state.sp, geo = state.geo;
    if (!p) return;
    clearTimers();
    var pg = p.pages[state.page] || { cols: [], widths: [] };
    var k = p.k, html = '';
    // Колонки разделов.
    html += '<div class="row" style="font-size:' + p.font + 'px">';
    var order = 0;
    pg.cols.forEach(function (col, ci) {
      var w = pg.widths[ci] || 0;
      var wEm = w / p.font;
      html += '<div class="col" style="width:' + w + 'px' + (ci ? ';margin-left:' + geo.gap + 'px' : '') + '">';
      col.forEach(function (ch, ki) {
        var s = sp.reg[ch.sec], sw = p.reg[ch.sec];
        if (!s || !sw) return;
        // Каскад: слева направо, сверху вниз (≤0,6 с суммарно).
        var delay = Math.min(0.6, 0.15 + ci * 0.12 + ki * 0.07 + (order++) * 0.01);
        var anim = mode === 'silent' ? '' : '-webkit-animation-delay:' + delay.toFixed(2) + 's;animation-delay:' + delay.toFixed(2) + 's;';
        html += '<section class="sec' + (mode === 'silent' ? '' : ' in') + '" style="' + anim +
          (ki ? 'margin-top:' + (SEC_GAP * k).toFixed(3) + 'em' : '') + '">';
        html += headHtml(s, fitHead(sw, wEm), k);
        for (var i = ch.from; i < ch.to; i++) html += itemHtml(s.items[i], sw.rows[i] ? fitRow(sw.rows[i], wEm) : 1, k);
        html += '</section>';
      });
      html += '</div>';
    });
    html += '</div>';
    // Лента внизу — на каждой странице, без повторной анимации при смене страниц.
    if (sp.band.length) {
      html += '<div class="band" style="font-size:' + p.bandFont + 'px' + (mode !== 'enter' ? ';-webkit-animation:none;animation:none' : '') + '">';
      sp.band.forEach(function (s, i) {
        var bw = p.band[i], w = p.bandWidths[i] || 0;
        var wEm = w / p.bandFont - BAND_PAD_X;
        html += '<div class="cell' + (i === 0 ? ' first' : '') + '" style="width:' + w + 'px">';
        html += headHtml(s, bw ? fitHead(bw, wEm) : 1, k);
        s.items.forEach(function (it, j) { html += itemHtml(it, bw && bw.rows[j] ? fitRow(bw.rows[j], wEm) : 1, k); });
        html += '</div>';
      });
      html += '<span class="sheen"></span></div>';
    }
    $('body').innerHTML = html;
    state.rendered = true;
    renderPagesIndicator();
    showMsg();
    scheduleRotation();
  }

  function itemsOnPage() {
    var pg = state.plan.pages[state.page], n = 0;
    if (pg) pg.cols.forEach(function (col) { col.forEach(function (ch) { n += ch.to - ch.from; }); });
    return n;
  }
  // На страницу — 8 с + 0,35 с на позицию (успеть найти своё), в пределах 10–22 с.
  function pageMs() { return Math.min(22000, Math.max(10000, 8000 + itemsOnPage() * 350)); }

  function renderPagesIndicator() {
    var el = $('pages');
    var n = state.plan ? state.plan.pages.length : 0;
    if (n < 2) { el.innerHTML = ''; return; }
    var html = '';
    for (var i = 0; i < n; i++) {
      var cls = i < state.page ? ' done' : i === state.page ? ' run' : '';
      var st = i === state.page ? ' style="-webkit-animation-duration:' + pageMs() + 'ms;animation-duration:' + pageMs() + 'ms"' : '';
      html += '<span class="seg"><span class="seg-fill' + cls + '"' + st + '></span></span>';
    }
    el.innerHTML = html;
  }

  function scheduleRotation() {
    if (!state.plan || state.plan.pages.length < 2) return;
    var ms = pageMs();
    state.timers.push(setTimeout(function () {
      var secs = $('body').querySelectorAll('.sec');
      for (var i = 0; i < secs.length; i++) secs[i].className = 'sec out';
    }, ms - 400));
    state.timers.push(setTimeout(function () {
      state.page = (state.page + 1) % state.plan.pages.length;
      renderPage('rotate');
    }, ms));
  }

  // ── Данные ────────────────────────────────────────────────────────────────

  function applyRaw(raw) {
    if (!raw || raw === state.raw) return;
    var parsed;
    try { parsed = JSON.parse(raw); } catch (e) { return; }
    if (!parsed || !parsed.sections) return;
    state.raw = raw;
    state.data = parsed;
    relayout('data');
  }

  function load() {
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', API + '?t=' + Date.now(), true);
      xhr.timeout = 20000;
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status === 200) {
          storageSet(CACHE_KEY, xhr.responseText);
          applyRaw(xhr.responseText);
        } else if (!state.data) {
          report('Меню не загрузилось (HTTP ' + xhr.status + ')');
          if (!state.rendered) $('body').innerHTML = '<div class="empty">Меню обновляется…</div>';
        }
      };
      xhr.send();
    } catch (e) {
      report('Загрузка: ' + (e && e.message ? e.message : e));
    }
  }

  function tickClock() {
    var d = new Date();
    var hh = d.getHours(), mm = d.getMinutes();
    $('clock').textContent = (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
  }

  // ── Старт ─────────────────────────────────────────────────────────────────

  // Перезагрузка плеером вскоре после прошлой — без вступительной анимации.
  try {
    var prev = JSON.parse(storageGet('titan_menu_load') || 'null');
    var nowTs = Date.now();
    state.quiet = !!(prev && nowTs - prev.t < QUIET_MS);
    state.loads = (prev && prev.n ? prev.n : 0) + 1;
    storageSet('titan_menu_load', JSON.stringify({ t: nowTs, n: state.loads }));
  } catch (e) { state.loads = 1; }
  if (state.quiet) $('root').className += ' quiet';

  tickClock();
  setInterval(tickClock, 10000);
  relayout('init');
  applyRaw(storageGet(CACHE_KEY));
  load();
  setInterval(load, POLL_MS);

  // Первый показ — когда загрузится шрифт (не дольше 2,5 с), чтобы экран не
  // перестраивался на глазах; поздняя дозагрузка шрифта — тихой перестройкой.
  function markReady() {
    if (state.ready) return;
    state.ready = true;
    relayout('init');
  }
  // Шрифт грузится лениво (когда им что-то нарисовано), поэтому запрашиваем нужные
  // начертания с кириллицей явно и ждём их, а не просто document.fonts.ready.
  try {
    if (document.fonts && document.fonts.load) {
      var sample = 'Меню Капучино 0123456789 \u20bd';
      var waits = ['500', '600', '700', '800'].map(function (wt) { return document.fonts.load(wt + ' 100px Inter', sample); });
      Promise.all(waits).then(function () { if (state.ready) relayout('fonts'); else markReady(); }, markReady);
    }
  } catch (e) { /* старый движок */ }
  setTimeout(markReady, 2500);
  setTimeout(function () { relayout('fonts'); }, 6000);

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { relayout('resize'); }, 300);
  });
  // Раз в 12 часов — перезагрузка страницы (свежая вёрстка после деплоев), но только
  // если сервер сейчас отдаёт страницу: при сбое сети экран показывает текущее меню.
  setInterval(function () {
    try {
      var x = new XMLHttpRequest();
      x.open('GET', location.pathname + '?ping=' + Date.now(), true);
      x.timeout = 20000;
      x.onreadystatechange = function () { if (x.readyState === 4 && x.status === 200) location.reload(); };
      x.send();
    } catch (e) { /* без перезагрузки */ }
  }, RELOAD_MS);
  showMsg();
})();
</script>
</body>
</html>
