services:
  postgres:
    image: postgres:16-alpine
    container_name: titan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: titan_hub
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - titan-net

  redis:
    image: redis:7-alpine
    container_name: titan-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - titan-net

  minio:
    image: minio/minio:RELEASE.2023-06-29T05-12-28Z
    container_name: titan-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - titan-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: titan-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://titan:${POSTGRES_PASSWORD:-changeme}@postgres:5432/titan_hub
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - titan-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: titan-web
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: /api
    networks:
      - titan-net

  wallet:
    build:
      context: .
      dockerfile: apps/wallet/Dockerfile
    container_name: titan-wallet
    restart: unless-stopped
    env_file: .env
    networks:
      - titan-net

  bot-admin:
    build:
      context: .
      dockerfile: apps/bot-admin/Dockerfile
    container_name: titan-bot-admin
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://titan:${POSTGRES_PASSWORD:-changeme}@postgres:5432/titan_hub
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - titan-net

  bot-wallet:
    build:
      context: .
      dockerfile: apps/bot-wallet/Dockerfile
    container_name: titan-bot-wallet
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://titan:${POSTGRES_PASSWORD:-changeme}@postgres:5432/titan_hub
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - titan-net

  nginx:
    image: nginx:alpine
    container_name: titan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - web
      - api
      - wallet
    networks:
      - titan-net

volumes:
  postgres-data:
  redis-data:
  minio-data:
  nginx-cache:

networks:
  titan-net:
    driver: bridge
