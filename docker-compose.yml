services:
  postgres:
    image: postgres:16-alpine
    container_name: titan-postgres
    restart: unless-stopped
    # Лимиты памяти: ни один контейнер не может уронить хост (4 ГБ RAM).
    mem_limit: 768m
    environment:
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: titan_hub
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - titan-net

  redis:
    image: redis:7-alpine
    container_name: titan-redis
    restart: unless-stopped
    mem_limit: 256m
    # AOF: переживаем краш без потери rate-limit/blacklist состояния.
    command: redis-server --save 60 1 --appendonly yes --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - titan-net

  minio:
    image: minio/minio:RELEASE.2023-06-29T05-12-28Z
    container_name: titan-minio
    restart: unless-stopped
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio-data:/data
    healthcheck:
      # mc отсутствует в server-образе → проверяем liveness-эндпоинт через curl
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    networks:
      - titan-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: titan-api
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env
    environment:
      DATABASE_URL: postgresql://titan:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/titan_hub
      REDIS_URL: redis://redis:6379
      # Бэкап/восстановление выполняются из API (кнопки в «О системе»).
      BACKUP_DIR: /backups
      RCLONE_CONFIG: /root/.config/rclone/rclone.conf
    volumes:
      # Локальные бэкапы (общие с host-скриптом backup-db.sh) + конфиг rclone (ro).
      - /opt/backups:/backups
      - /root/.config/rclone:/root/.config/rclone:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Healthcheck — чтобы nginx стартовал ТОЛЬКО после прогона миграций (иначе
    # окно 502 при холодном старте/ребуте хоста). node fetch встроен (Node 18+).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - titan-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: titan-web
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: /api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - titan-net

  wallet:
    build:
      context: .
      dockerfile: apps/wallet/Dockerfile
    container_name: titan-wallet
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/wallet').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - titan-net

  bot-admin:
    build:
      context: .
      dockerfile: apps/bot-admin/Dockerfile
    container_name: titan-bot-admin
    restart: unless-stopped
    mem_limit: 256m
    env_file: .env
    environment:
      DATABASE_URL: postgresql://titan:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/titan_hub
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - titan-net

  bot-wallet:
    build:
      context: .
      dockerfile: apps/bot-wallet/Dockerfile
    container_name: titan-bot-wallet
    restart: unless-stopped
    mem_limit: 256m
    env_file: .env
    environment:
      DATABASE_URL: postgresql://titan:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/titan_hub
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - titan-net

  nginx:
    image: nginx:alpine
    container_name: titan-nginx
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    # Стартуем nginx только когда апстримы здоровы (api прогнал миграции) —
    # закрывает окно 502 при холодном старте/перезагрузке хоста.
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      wallet:
        condition: service_healthy
    networks:
      - titan-net

volumes:
  postgres-data:
  redis-data:
  minio-data:
  nginx-cache:

networks:
  titan-net:
    driver: bridge
